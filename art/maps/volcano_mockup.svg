<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1536" width="1536" height="1536">
  <!-- Volcano, map mockup. 24x24 tiles, 64px a tile. Flat style: hard-edged colour, no blur, no glow.
       The rock, cracks and rim are the map; everything placed on it is computer-placed per day from art/structures. -->
  <defs>
    <pattern id="fiss" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#2A1E20"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 22 L14 26 L24 18 L38 28 L52 24 L64 30 M24 18 L28 0 M38 28 L34 46 L44 64 M14 26 L8 44 L0 48 M52 24 L58 46 L64 50" stroke="#FF6A24" stroke-width="5"/>
        <path d="M0 22 L14 26 L24 18 L38 28 L52 24 L64 30" stroke="#FFC23A" stroke-width="2"/>
      </g>
    </pattern>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0 V64 H0" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".07"/></pattern>
  </defs>

  <!-- flat basalt -->
  <rect width="1536" height="1536" fill="#3A3138"/>
  <!-- a few hard-edged tone shifts (cooled flows of slightly different rock) -->
  <g>
    <path d="M60 980 L260 900 L480 940 L640 1060 L620 1220 L420 1300 L180 1260 L60 1160 Z" fill="#3F353D"/>
    <path d="M840 120 L1100 90 L1360 160 L1470 300 L1400 440 L1160 480 L960 400 L860 260 Z" fill="#3F353D"/>
    <path d="M760 1180 L1000 1120 L1240 1180 L1300 1340 L1140 1470 L880 1450 L760 1330 Z" fill="#352D33"/>
    <path d="M120 120 L360 90 L480 200 L420 340 L220 380 L100 280 Z" fill="#352D33"/>
  </g>

  <!-- cracks: plain dark lines -->
  <g fill="none" stroke="#211A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 180 L170 210 L230 190 L300 240 L380 230 L430 280"/><path d="M230 190 L250 120 L300 90"/><path d="M300 240 L290 320 L340 380"/>
    <path d="M620 120 L680 160 L760 150 L800 200 L880 210"/><path d="M760 150 L770 80"/><path d="M800 200 L790 270 L840 320"/>
    <path d="M1180 120 L1240 180 L1320 190 L1370 260 L1440 280"/><path d="M1320 190 L1340 120"/>
    <path d="M1120 670 L1130 600 L1190 560"/><path d="M1250 730 L1270 660"/>
    <path d="M640 860 L700 900 L690 980 L740 1040 L820 1050"/><path d="M700 900 L780 880 L830 920"/><path d="M690 980 L620 1010"/>
    <path d="M120 820 L200 850 L260 830 L320 880"/><path d="M200 850 L190 930 L240 980"/>
    <path d="M380 1440 L440 1400 L520 1420 L580 1380"/><path d="M440 1400 L430 1330"/>
    <path d="M1180 1380 L1200 1450"/><path d="M1240 1330 L1230 1260 L1280 1210"/>
    <path d="M1380 980 L1420 1060 L1400 1130"/>
    <path d="M560 420 L610 470 L600 540"/>
  </g>
  <!-- two cracks still hot: flat orange with a dark crust either side -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M980 640 L1040 680 L1120 670 L1170 720 L1250 730 L1300 790" stroke="#211A1F" stroke-width="10"/>
    <path d="M1040 1420 L1100 1370 L1180 1380 L1240 1330 L1320 1350" stroke="#211A1F" stroke-width="10"/>
    <path d="M980 640 L1040 680 L1120 670 L1170 720 L1250 730" stroke="#FF6A24" stroke-width="4"/>
    <path d="M1040 1420 L1100 1370 L1180 1380 L1240 1330" stroke="#FF6A24" stroke-width="4"/>
    <path d="M1040 680 L1120 670" stroke="#FFC23A" stroke-width="1.6"/>
  </g>

  <!-- lava fissure patch (tile-aligned; zombies burn while crossing): a flat scorched ring, then the tiles, then hot cracks leading off it -->
  <path d="M256 576 H448 V640 H512 V768 H320 V832 H256 Z" fill="none" stroke="#2A2024" stroke-width="28" stroke-linejoin="round"/>
  <path d="M256 576 H448 V640 H512 V768 H320 V832 H256 Z" fill="url(#fiss)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M448 600 L500 560 L560 570 L610 520 M512 720 L580 740 L630 710 L700 730 M290 832 L270 890 L300 950 M256 640 L200 620 L150 650" stroke="#211A1F" stroke-width="9"/>
    <path d="M448 600 L500 560 L560 570" stroke="#FF6A24" stroke-width="3.5"/>
    <path d="M512 720 L580 740 L630 710" stroke="#FF6A24" stroke-width="3.5"/>
    <path d="M290 832 L270 890" stroke="#FF6A24" stroke-width="3.5"/>
    <path d="M256 640 L200 620" stroke="#FF6A24" stroke-width="3.5"/>
  </g>

  <!-- a few embers -->
  <g fill="#FF8A2E"><circle cx="620" cy="300" r="3"/><circle cx="1300" cy="760" r="2.5"/><circle cx="460" cy="1180" r="3"/><circle cx="980" cy="1380" r="2.5"/><circle cx="540" cy="620" r="2.5"/></g>

  <!-- jagged crater rim (flat) -->
  <g fill="#231C21">
    <path d="M0 0 H1536 V28 L1490 46 L1440 24 L1380 50 L1320 26 L1250 48 L1180 22 L1110 46 L1040 24 L960 50 L880 26 L800 48 L720 22 L640 46 L560 24 L480 50 L400 26 L320 48 L240 24 L160 46 L80 26 L0 44 Z"/>
    <path d="M0 1536 H1536 V1508 L1480 1490 L1420 1512 L1350 1488 L1280 1510 L1200 1486 L1120 1512 L1040 1490 L960 1510 L880 1486 L800 1512 L720 1488 L640 1510 L560 1486 L480 1512 L400 1490 L320 1510 L240 1488 L160 1512 L80 1490 L0 1508 Z"/>
    <path d="M0 0 V1536 H28 L46 1480 L24 1420 L50 1350 L26 1280 L48 1200 L22 1120 L46 1040 L24 960 L50 880 L26 800 L48 720 L22 640 L46 560 L24 480 L50 400 L26 320 L48 240 L22 160 L46 80 L26 0 Z"/>
    <path d="M1536 0 V1536 H1508 L1490 1480 L1512 1420 L1488 1350 L1510 1280 L1486 1200 L1512 1120 L1490 1040 L1510 960 L1486 880 L1512 800 L1488 720 L1510 640 L1486 560 L1512 480 L1490 400 L1510 320 L1488 240 L1512 160 L1490 80 L1510 0 Z"/>
  </g>

  <!-- grid -->
  <rect width="1536" height="1536" fill="url(#grid)"/>

  <!-- placed for today -->
  <image href="../structures/steam_vent.svg" x="1016" y="952" width="80" height="80"/>
  <image href="../structures/power_inlet.svg" x="1144" y="376" width="80" height="80"/>
  <image href="../structures/live_cable.svg" x="311" y="1076" width="146" height="88"/>
  <image href="../structures/home.svg" x="696" y="696" width="80" height="80"/>
</svg>
