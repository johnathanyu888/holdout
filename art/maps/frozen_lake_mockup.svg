<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1536 1536" width="1536" height="1536">
  <!-- Frozen Lake, demo map mockup. 24x24 tiles, 64px a tile (1536x1536 at full size).
       The ice and shoreline are the map; everything placed on it (structures, slick ice, ridges, entry edges, home)
       is computer-placed per day and drawn from art/structures. -->
  <defs>
    <linearGradient id="iceG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C7EAF4"/><stop offset=".5" stop-color="#B4E0EE"/><stop offset="1" stop-color="#A6D7E8"/></linearGradient>
    <filter id="blur18" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <pattern id="slick" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#9FDCF0"/><rect width="64" height="64" fill="#C8F0FA" opacity=".5"/>
      <path d="M-8 30 L30 -8 M10 72 L72 10 M34 72 L72 34" stroke="#FFFFFF" stroke-width="7" opacity=".55" stroke-linecap="round"/>
      <path d="M-8 44 L44 -8" stroke="#FFFFFF" stroke-width="2.5" opacity=".7" stroke-linecap="round"/>
      <circle cx="48" cy="16" r="2.2" fill="#FFFFFF"/>
    </pattern>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0 V64 H0" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".28"/></pattern>
    <g id="bub"><circle r="4" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity=".7"/><circle cx="9" cy="5" r="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity=".6"/><circle cx="-6" cy="8" r="2" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity=".5"/></g>
  </defs>

  <!-- the ice sheet -->
  <rect width="1536" height="1536" fill="url(#iceG)"/>
  <!-- deep, dark-blue ice and pale frosted ice, very soft -->
  <g filter="url(#blur18)">
    <ellipse cx="560" cy="620" rx="300" ry="190" fill="#8FC8DE" opacity=".55"/>
    <ellipse cx="1040" cy="1000" rx="260" ry="170" fill="#8FC8DE" opacity=".5"/>
    <ellipse cx="1120" cy="420" rx="200" ry="140" fill="#DDF3F9" opacity=".7"/>
    <ellipse cx="380" cy="1120" rx="220" ry="140" fill="#DDF3F9" opacity=".65"/>
    <ellipse cx="780" cy="780" rx="160" ry="120" fill="#7DBCD6" opacity=".35"/>
  </g>
  <!-- long fracture lines in the ice (decals only, nothing blocks movement) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 260 L330 330 L420 300 L560 420 L640 400 M330 330 L360 420 M560 420 L540 520" stroke="#6FB2CC" stroke-width="5" opacity=".55"/>
    <path d="M180 260 L330 330 L420 300 L560 420 L640 400 M330 330 L360 420 M560 420 L540 520" stroke="#F2FBFF" stroke-width="2" transform="translate(-2 -2)"/>
    <path d="M980 1180 L1100 1120 L1180 1160 L1320 1080 M1100 1120 L1080 1020 M1180 1160 L1200 1260" stroke="#6FB2CC" stroke-width="5" opacity=".55"/>
    <path d="M980 1180 L1100 1120 L1180 1160 L1320 1080 M1100 1120 L1080 1020 M1180 1160 L1200 1260" stroke="#F2FBFF" stroke-width="2" transform="translate(-2 -2)"/>
    <path d="M1260 300 L1180 360 L1200 440 L1120 520" stroke="#6FB2CC" stroke-width="4" opacity=".5"/>
    <path d="M1260 300 L1180 360 L1200 440 L1120 520" stroke="#F2FBFF" stroke-width="1.8" transform="translate(-2 -2)"/>
    <path d="M260 860 L340 900 L320 980" stroke="#6FB2CC" stroke-width="4" opacity=".5"/>
    <path d="M260 860 L340 900 L320 980" stroke="#F2FBFF" stroke-width="1.8" transform="translate(-2 -2)"/>
  </g>
  <!-- trapped air bubbles -->
  <use href="#bub" x="620" y="560"/><use href="#bub" x="660" y="600"/><use href="#bub" x="1000" y="960"/><use href="#bub" x="1060" y="1040"/><use href="#bub" x="420" y="1080"/><use href="#bub" x="840" y="300"/><use href="#bub" x="1240" y="700"/>
  <!-- wind-blown snow streaks -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity=".6"><path d="M700 200 q60 -10 120 0" stroke-width="6"/><path d="M760 230 q40 -6 80 0" stroke-width="4"/><path d="M200 700 q60 -10 120 0" stroke-width="6"/><path d="M1180 860 q50 -8 100 0" stroke-width="5"/><path d="M560 1280 q60 -10 120 0" stroke-width="6"/><path d="M900 1400 q40 -6 80 0" stroke-width="4"/></g>

  <!-- slick ice patches (tile-aligned; zombies speed up and slide) -->
  <g>
    <path d="M832 384 H1216 V448 H1280 V576 H1152 V640 H896 V576 H832 Z" fill="url(#slick)"/>

  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".8" stroke-linejoin="round">
    <path d="M832 384 H1216 V448 H1280 V576 H1152 V640 H896 V576 H832 Z"/>

  </g>

  <!-- snowy shoreline around the lake -->
  <g fill="#F4F8FA">
    <path d="M0 0 H1536 V30 Q1490 52 1440 34 Q1380 16 1320 40 Q1250 62 1180 36 Q1110 14 1040 40 Q960 64 880 36 Q800 12 720 38 Q640 62 560 36 Q480 14 400 38 Q320 60 240 34 Q160 14 80 38 Q40 50 0 34 Z"/>
    <path d="M0 1536 H1536 V1506 Q1480 1486 1420 1504 Q1350 1524 1280 1500 Q1200 1476 1120 1502 Q1040 1526 960 1500 Q880 1476 800 1502 Q720 1526 640 1500 Q560 1478 480 1502 Q400 1524 320 1500 Q240 1478 160 1500 Q80 1520 0 1500 Z"/>
    <path d="M0 0 V1536 H30 Q52 1480 34 1420 Q16 1350 40 1280 Q62 1200 36 1120 Q14 1040 40 960 Q64 880 36 800 Q12 720 38 640 Q62 560 36 480 Q14 400 38 320 Q60 240 34 160 Q16 80 36 0 Z"/>
    <path d="M1536 0 V1536 H1506 Q1486 1480 1504 1420 Q1524 1350 1500 1280 Q1476 1200 1502 1120 Q1526 1040 1500 960 Q1476 880 1502 800 Q1526 720 1500 640 Q1478 560 1502 480 Q1524 400 1500 320 Q1478 240 1500 160 Q1520 80 1500 0 Z"/>
  </g>
  <g fill="none" stroke="#D6E6EE" stroke-width="4" opacity=".8"><path d="M0 34 Q40 50 80 38 Q160 14 240 34 Q320 60 400 38 Q480 14 560 36 Q640 62 720 38 Q800 12 880 36 Q960 64 1040 40 Q1110 14 1180 36 Q1250 62 1320 40 Q1380 16 1440 34 Q1490 52 1536 30"/></g>

  <!-- grid -->
  <rect width="1536" height="1536" fill="url(#grid)"/>

  <!-- pressure ridges (launch zombies ~3 tiles in the arrow's direction) -->

  <image href="../structures/pressure_ridge.svg" x="1216" y="768" width="128" height="64" transform="rotate(180 1280 800)"/>

  <!-- fixed structures -->
  <image href="../structures/power_inlet.svg" x="312" y="568" width="80" height="80"/>
  <image href="../structures/fuel_tank.svg" x="1144" y="184" width="80" height="80"/>

  <!-- example home placement -->
  <image href="../structures/home.svg" x="696" y="696" width="80" height="80"/>

  <!-- zombie entry: every edge tile, all four sides -->
  <g>
    <g transform="translate(-40 0)"><image href="../structures/entry_edge.svg" x="0" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="270" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="540" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="810" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="1080" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="1296" y="0" width="320" height="96"/></g>
    <g transform="translate(1576 1536) rotate(180)"><image href="../structures/entry_edge.svg" x="0" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="270" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="540" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="810" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="1080" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="1296" y="0" width="320" height="96"/></g>
    <g transform="translate(0 1576) rotate(-90)"><image href="../structures/entry_edge.svg" x="0" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="270" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="540" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="810" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="1080" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="1296" y="0" width="320" height="96"/></g>
    <g transform="translate(1536 -40) rotate(90)"><image href="../structures/entry_edge.svg" x="0" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="270" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="540" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="810" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="1080" y="0" width="320" height="96"/><image href="../structures/entry_edge.svg" x="1296" y="0" width="320" height="96"/></g>
  </g>
</svg>
