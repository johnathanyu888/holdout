    <rect x="396" y="208" width="208" height="12" rx="3" fill="#B8473A" stroke-width="2.5"/>
    <rect x="470" y="208" width="60" height="40" fill="#D9A441" stroke-width="2.5"/>
    <g stroke-width="2"><rect x="410" y="214" width="6" height="14" fill="#F2E6CC"/><rect x="584" y="214" width="6" height="14" fill="#F2E6CC"/></g>
    <circle cx="500" cy="226" r="12" fill="#B8863A" stroke-width="3"/><circle cx="500" cy="226" r="6" fill="#5A3A22" stroke-width="1.5"/>
    <g stroke-width="2"><circle cx="440" cy="232" r="9" fill="#E8E4DA"/><circle cx="436" cy="230" r="4" fill="#F28C38"/><circle cx="443" cy="233" r="4" fill="#E0584A"/><circle cx="560" cy="232" r="9" fill="#E8E4DA"/><circle cx="557" cy="230" r="4" fill="#FFD34D"/></g>
  </g>
  <g fill="#FFD34D"><circle cx="413" cy="212" r="2.5"/><circle cx="587" cy="212" r="2.5"/></g>
  <g fill="#D2D0CC" opacity=".7"><circle cx="504" cy="200" r="6"/><circle cx="510" cy="186" r="8"/><circle cx="504" cy="170" r="9"/></g>
