  <!-- hanging lanterns, incense burners, petals blown in -->
  <use href="#plan" x="250" y="160"/><use href="#plan" x="760" y="160"/><use href="#plan" x="500" y="420"/><use href="#plan" x="220" y="440"/>
  <g stroke="#25282C" stroke-width="3"><circle cx="500" cy="600" r="20" fill="#B8863A"/><circle cx="500" cy="600" r="11" fill="#5A3A22" stroke-width="2"/></g>
  <g fill="#D2D0CC" opacity=".6"><circle cx="506" cy="582" r="6"/><circle cx="512" cy="566" r="8"/></g>
  <use href="#pet" x="640" y="400"/><use href="#pet" x="700" y="360"/><use href="#pet" x="580" y="500"/><use href="#pet" x="740" y="520"/><use href="#pet" x="660" y="300"/><use href="#pet" x="520" y="470"/><use href="#pet" x="610" y="620"/>
  <g fill="none" stroke-linecap="round"><path d="M700 112 Q690 150 712 180 Q730 200 716 240" stroke="#25282C" stroke-width="7"/><path d="M700 112 Q690 150 712 180 Q730 200 716 240" stroke="#4E8A32" stroke-width="3.5"/></g>
