    <rect x="8" y="230" width="28" height="80" fill="url(#lattice)" stroke-width="2.5"/><rect x="8" y="470" width="28" height="80" fill="url(#lattice)" stroke-width="2.5"/>
    <rect x="964" y="230" width="28" height="80" fill="url(#lattice)" stroke-width="2.5"/>
    <rect x="0" y="662" width="420" height="38" fill="#7A2E22" stroke-width="3"/><rect x="580" y="662" width="420" height="38" fill="#7A2E22" stroke-width="3"/>
    <rect x="420" y="660" width="80" height="16" rx="3" fill="#B8473A" stroke-width="3" transform="rotate(-24 420 668)"/>
    <rect x="500" y="660" width="80" height="16" rx="3" fill="#B8473A" stroke-width="3" transform="rotate(20 580 668)"/>
