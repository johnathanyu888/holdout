<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
<!--KIT2-->
    <pattern id="floorW" width="120" height="22" patternUnits="userSpaceOnUse"><rect width="120" height="22" fill="#7A3A2A"/><path d="M0 22 H120" stroke="#5E2A1E" stroke-width="2.5"/><path d="M60 0 V22" stroke="#5E2A1E" stroke-width="2"/><path d="M8 8 H44 M72 14 H110" stroke="#8E4A36" stroke-width="2" stroke-linecap="round"/></pattern>
    <pattern id="jadeT" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#3FAF94"/><rect x="3" y="3" width="34" height="34" rx="3" fill="#4FBFA2"/><path d="M8 10 L16 8" stroke="#8FE6CC" stroke-width="2.5" stroke-linecap="round"/><rect x="3" y="3" width="34" height="34" rx="3" fill="none" stroke="#2F8F7A" stroke-width="2"/></pattern>
    <pattern id="dais" width="46" height="30" patternUnits="userSpaceOnUse"><rect width="46" height="30" fill="#C9D8C4"/><path d="M0 0 H46 M0 15 H46 M23 0 V15 M11 15 V30 M34 15 V30" stroke="#A3B8A2" stroke-width="2"/></pattern>
    <pattern id="lattice" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#F2E6CC"/><path d="M0 8 H16 M8 0 V16" stroke="#7A2E22" stroke-width="3"/></pattern>
    <pattern id="roofT" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#2F8F7A"/><path d="M0 0 V10" stroke="#267564" stroke-width="3"/></pattern>
    <g id="pillar"><ellipse cx="6" cy="8" rx="34" ry="30" fill="#000" opacity=".3" filter="url(#sh)"/><circle r="32" fill="#D9A441" stroke="#25282C" stroke-width="4"/><circle r="25" fill="#B8473A" stroke="#25282C" stroke-width="3.5"/><path d="M-16 -12 A20 20 0 0 1 2 -22" stroke="#E0705A" stroke-width="5" fill="none" stroke-linecap="round"/><circle r="25" fill="none" stroke="#8E3226" stroke-width="2" stroke-dasharray="4 6"/></g>
    <g id="cushion"><rect x="-17" y="-17" width="34" height="34" rx="12" fill="#D9A441" stroke="#25282C" stroke-width="3"/><rect x="-11" y="-11" width="22" height="22" rx="8" fill="#E8B84A"/><circle r="3" fill="#B8473A"/></g>
    <g id="plan"><circle r="40" fill="url(#warm)"/><circle r="15" fill="#D9534F" stroke="#25282C" stroke-width="3"/><path d="M-15 0 H15 M-12 -8 H12 M-12 8 H12" stroke="#B8473A" stroke-width="2"/><rect x="-7" y="-18" width="14" height="5" rx="2" fill="#D9A441" stroke="#25282C" stroke-width="2"/><rect x="-7" y="13" width="14" height="5" rx="2" fill="#D9A441" stroke="#25282C" stroke-width="2"/></g>
    <g id="pet"><ellipse rx="4" ry="2.5" fill="#F4AFC4" transform="rotate(30)"/></g>
    <radialGradient id="vig"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
