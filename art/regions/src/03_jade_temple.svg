    <rect x="0" y="34" width="1000" height="78" fill="#A83C2E" stroke-width="3"/>
    <rect x="0" y="34" width="1000" height="10" fill="#D9A441" stroke-width="2"/>
    <rect x="0" y="102" width="1000" height="10" fill="#D9A441" stroke-width="2"/>
