    <ellipse cx="500" cy="170" rx="44" ry="30" fill="#2F8F7A" stroke-width="3.5"/>
    <g fill="#3FAF94" stroke-width="3"><circle cx="472" cy="140" r="14"/><circle cx="490" cy="128" r="14"/><circle cx="510" cy="128" r="14"/><circle cx="528" cy="140" r="14"/><circle cx="466" cy="160" r="13"/><circle cx="534" cy="160" r="13"/></g>
    <circle cx="500" cy="150" r="22" fill="#4FBFA2" stroke-width="3.5"/>
