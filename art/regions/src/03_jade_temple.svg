    <rect x="666" y="48" width="34" height="52" rx="2" fill="#F2E6CC" stroke-width="2.5"/><path d="M676 58 h14 M683 58 v30 M676 72 h14" stroke="#25282C" stroke-width="2" fill="none"/>
