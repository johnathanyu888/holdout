<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
<!--KIT2-->
    <pattern id="dirt" width="70" height="70" patternUnits="userSpaceOnUse"><rect width="70" height="70" fill="#9A8E7C"/><g fill="#887C6A"><circle cx="10" cy="12" r="2.8"/><circle cx="26" cy="58" r="2.2"/><circle cx="60" cy="16" r="2.4"/></g><g fill="#B0A492"><circle cx="34" cy="22" r="1.8"/><circle cx="8" cy="40" r="1.5"/></g></pattern>
    <g id="tire2"><circle r="16" fill="#2A2A2E" stroke="#25282C" stroke-width="3"/><circle r="16" fill="none" stroke="#3E3E44" stroke-width="4" stroke-dasharray="3 3"/><circle r="7" fill="#5E5E64" stroke="#25282C" stroke-width="2"/></g>
    <g id="car3"><rect x="-38" y="-17" width="76" height="34" rx="9" stroke="#25282C" stroke-width="3.5"/><rect x="-14" y="-13" width="30" height="26" rx="5" fill="#3A4A5C" stroke="#25282C" stroke-width="2.5"/><path d="M-8 -8 L2 2 L-6 8" stroke="#9EC6E0" stroke-width="2" fill="none"/></g>
    <g id="appl"><rect x="-18" y="-18" width="36" height="36" rx="4" fill="#E8E8E2" stroke="#25282C" stroke-width="3"/><circle r="10" fill="#9EC6E0" stroke="#25282C" stroke-width="2.5"/><circle r="5" fill="#C9CED6"/></g>
    <g id="fridge"><rect x="-16" y="-24" width="32" height="48" rx="4" fill="#DDE3E8" stroke="#25282C" stroke-width="3"/><path d="M-16 -4 H16 M10 -18 V-10 M10 2 V12" stroke="#25282C" stroke-width="2.5"/></g>
    <g id="cont"><rect x="-70" y="-22" width="140" height="44" rx="3" stroke="#25282C" stroke-width="3.5"/><path d="M-60 -22 V22 M-44 -22 V22 M-28 -22 V22 M-12 -22 V22 M4 -22 V22 M20 -22 V22 M36 -22 V22 M52 -22 V22" stroke="#000" stroke-opacity=".18" stroke-width="3"/></g>
  </defs>
  <rect width="1000" height="700" fill="url(#dirt)"/>
  <!-- oil puddles, tyre tracks -->
  <g fill="#1E1C1A" opacity=".55"><path d="M380 330 Q420 310 460 330 Q470 356 430 362 Q390 360 380 330 Z"/><path d="M620 620 Q660 604 690 622 Q690 642 650 644 Q620 640 620 620 Z"/></g>
  <g fill="#5D8FC9" opacity=".25"><ellipse cx="420" cy="334" rx="16" ry="5"/></g>
  <path d="M0 420 Q300 360 560 380 Q800 400 1000 340" fill="none" stroke="#7E7262" stroke-width="22" stroke-dasharray="8 6" opacity=".7"/>

  <!-- walls of junk around the yard (out of reach) -->
  <use href="#cont" transform="translate(90 40) rotate(-4)" fill="#B8473A"/><use href="#cont" transform="translate(240 34) rotate(3)" fill="#3F6FAE"/><use href="#cont" transform="translate(390 40) rotate(-2)" fill="#4FA83A"/><use href="#cont" transform="translate(110 4) rotate(2)" fill="#E8A030"/><use href="#cont" transform="translate(300 0) rotate(-3)" fill="#8E98A2"/>
  <g stroke="#25282C" stroke-width="4" stroke-linejoin="round">
    <polygon points="620,0 1000,0 1000,170 940,160 900,120 820,130 760,90 680,80" fill="#6E767E"/>
    <polygon points="660,0 1000,0 1000,140 940,130 900,96 820,104 760,66 700,56" fill="#8E98A2"/>
    <polygon points="0,700 0,560 60,580 100,620 160,640 200,700" fill="#6E767E"/>
  </g>
  <g stroke="#25282C" stroke-width="3" stroke-linejoin="round"><polygon points="720,40 760,30 770,56 730,64" fill="#A8653A"/><polygon points="840,60 880,52 884,80 846,84" fill="#5D8FC9"/><polygon points="930,90 970,84 976,110 936,114" fill="#E8B84A"/><polygon points="30,600 70,610 66,640 26,632" fill="#A8653A"/></g>
  <use href="#tire2" x="790" y="100"/><use href="#tire2" x="960" y="40"/><use href="#tire2" x="120" y="660"/>
  <path d="M1000 260 Q980 400 1000 560" fill="none" stroke="#5E6670" stroke-width="10" stroke-dasharray="2 6"/>

  <!-- ===== tappable: LEANING CAR STACK ===== -->
  <rect x="198" y="198" width="150" height="120" rx="10" fill="#000" opacity=".3" filter="url(#sh)" transform="rotate(10 273 258)"/>
  <g id="o_stack">
    <use href="#car3" transform="translate(266 270) rotate(10) scale(1.6)" fill="#B8473A"/>
    <use href="#car3" transform="translate(262 256) rotate(16) scale(1.5)" fill="#5D8FC9"/>
    <use href="#car3" transform="translate(270 240) rotate(4) scale(1.4)" fill="#E8B84A"/>
    <use href="#car3" transform="translate(266 226) rotate(14) scale(1.3)" fill="#4FA83A"/>
  </g>
  <flash ref="o_stack" begin="0"/>

  <!-- ===== tappable: CRANE CAB + magnet ===== -->
  <rect x="512" y="176" width="96" height="96" rx="8" fill="#000" opacity=".3" filter="url(#sh)" transform="rotate(-15 560 224)"/>
  <g id="o_crane" stroke="#25282C" stroke-linejoin="round">
    <g transform="rotate(-15 556 216)">
      <rect x="508" y="168" width="96" height="96" rx="8" fill="#E0B030" stroke-width="4.5"/>
      <rect x="520" y="180" width="40" height="34" rx="4" fill="#7FC8E0" stroke-width="3"/>
      <rect x="564" y="226" width="34" height="30" rx="3" fill="#5E6670" stroke-width="3"/>
    </g>
    <path d="M584 204 L760 176" stroke-width="18" stroke-linecap="round"/>
    <path d="M584 204 L760 176" stroke="#F2C230" stroke-width="11" stroke-linecap="round"/>
    <path d="M594 202 L612 194 L630 198 L648 190 L666 194 L684 186 L702 190 L720 182 L738 186 L756 178" fill="none" stroke-width="2"/>
    <path d="M760 176 V246" stroke-width="2.5"/>
    <circle cx="760" cy="264" r="22" fill="#5E6670" stroke-width="4"/><circle cx="760" cy="264" r="11" fill="#8E98A2" stroke-width="2.5"/>
    <rect x="744" y="282" width="34" height="14" rx="3" fill="#A8653A" stroke-width="2.5" transform="rotate(12 761 289)"/>
  </g>
  <flash ref="o_crane" begin="0.5"/>

  <!-- ===== tappable: YARD OFFICE ===== -->
  <rect x="830" y="324" width="140" height="92" rx="6" fill="#000" opacity=".3" filter="url(#sh)" transform="rotate(8 900 370)"/>
  <g id="o_office" transform="rotate(8 894 362)" stroke="#25282C" stroke-linejoin="round">
    <rect x="824" y="316" width="140" height="92" rx="6" fill="url(#metal)" stroke-width="4.5"/>
    <rect x="824" y="354" width="140" height="10" fill="#4A78B4" stroke-width="2.5"/>
    <rect x="886" y="294" width="72" height="24" rx="3" fill="#E8B84A" stroke-width="3"/><path d="M896 306 h52" stroke-width="3" stroke-dasharray="6 4"/>
    <rect x="840" y="408" width="40" height="12" rx="2" fill="#9A6838" stroke-width="2.5"/>
  </g>
  <use href="#barrel" transform="translate(800 420) scale(.9)"/>
  <flash ref="o_office" begin="1.0"/>

  <!-- ===== tappable: APPLIANCE HEAP ===== -->
  <g id="o_appl">
    <use href="#fridge" transform="translate(470 476) rotate(-24)"/><use href="#appl" transform="translate(522 506) rotate(12)"/><use href="#appl" transform="translate(500 452) rotate(-8)"/><use href="#fridge" transform="translate(566 470) rotate(66)"/><use href="#appl" transform="translate(546 548) rotate(28)"/><use href="#appl" transform="translate(456 528) rotate(-40)"/>
    <path d="M462 530 Q500 576 566 526" fill="none" stroke="#25282C" stroke-width="6"/><path d="M462 530 Q500 576 566 526" fill="none" stroke="#E08A3A" stroke-width="3"/>
  </g>
  <flash ref="o_appl" begin="0.3"/>

  <!-- ===== tappable: TIRE MOUNTAIN ===== -->
  <g id="o_tires">
    <use href="#tire2" x="740" y="540"/><use href="#tire2" x="772" y="550"/><use href="#tire2" x="756" y="520"/><use href="#tire2" x="790" y="516"/><use href="#tire2" x="772" y="490"/><use href="#tire2" x="720" y="510"/><use href="#tire2" x="808" y="574"/><use href="#tire2" x="742" y="574"/><use href="#tire2" x="806" y="482"/>
  </g>
  <flash ref="o_tires" begin="1.3"/>

  <!-- ===== tappable: CAR CRUSHER ===== -->
  <rect x="104" y="448" width="200" height="130" rx="8" fill="#000" opacity=".3" filter="url(#sh)" transform="rotate(-6 204 513)"/>
  <g id="o_crusher" transform="rotate(-6 198 506)" stroke="#25282C" stroke-linejoin="round">
    <rect x="96" y="440" width="200" height="130" rx="8" fill="#5E6670" stroke-width="4.5"/>
    <rect x="110" y="454" width="120" height="102" rx="4" fill="#3A3E44" stroke-width="3"/>
    <rect x="124" y="468" width="92" height="74" rx="3" fill="#8E98A2" stroke-width="3"/>
    <g stroke="#6E767E" stroke-width="3"><path d="M128 484 H212 M128 500 H212 M128 516 H212 M128 532 H212"/></g>
    <rect x="238" y="454" width="46" height="56" rx="4" fill="#E0B030" stroke-width="3"/>
    <circle cx="261" cy="528" r="12" fill="#D9534F" stroke-width="3"/>
  </g>
  <g stroke="#25282C" stroke-width="3" stroke-linejoin="round"><rect x="316" y="530" width="42" height="42" rx="3" fill="#5D8FC9" transform="rotate(10 337 551)"/><rect x="326" y="584" width="38" height="38" rx="3" fill="#B8473A" transform="rotate(-8 345 603)"/></g>
  <flash ref="o_crusher" begin="0.8"/>

  <!-- loose junk + a burn barrel -->
  <g stroke="#25282C" stroke-width="3" stroke-linejoin="round"><polygon points="640,380 680,364 700,386 660,400" fill="#9AA3AD"/><polygon points="360,400 390,390 402,412 370,418" fill="#A8653A"/><rect x="600" y="620" width="60" height="10" rx="5" fill="#8E98A2" transform="rotate(-20 630 625)"/><polygon points="880,600 920,590 930,620 890,628" fill="#9AA3AD"/></g>
  <use href="#tire2" x="420" y="640"/><use href="#barrel" transform="translate(640 470) scale(.9)"/><use href="#barrel" transform="translate(664 492) scale(.8)"/>
  <g transform="translate(600 300)"><circle r="12" fill="#7C4A34" stroke="#25282C" stroke-width="3"/><circle cy="-6" r="24" fill="url(#warm)"/><path d="M-7 4 Q-9 -6 -3 -8 Q-3 -2 0 -3 Q-1 -11 3 -15 Q6 -6 7 -4 Q9 0 7 4 Z" fill="#FF6A2B" stroke="#25282C" stroke-width="2"/></g>

  <card x="60" y="70" ax="230" ay="210" name="Leaning car stack" desc="Four wrecks deep. Pry the doors off." time="2h" loot="scrap,glass" danger="risky"/>
  <hud region="THE SCRAPYARD" danger="risky" hours="8" loot="Scrap, gears, wire"/>
</svg>
