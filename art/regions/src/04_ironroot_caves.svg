    <pattern id="ifloor" width="64" height="64" patternUnits="userSpaceOnUse"><rect width="64" height="64" fill="#6A4E42"/><g fill="#5A4036"><circle cx="10" cy="12" r="4"/><circle cx="42" cy="36" r="4.5"/><circle cx="24" cy="54" r="3"/></g><g fill="#8A5A40"><circle cx="50" cy="10" r="2.6"/><circle cx="14" cy="34" r="2.2"/><circle cx="56" cy="54" r="2"/></g><path d="M30 6 l7 7 l-3 7" stroke="#4E362C" stroke-width="1.6" fill="none"/></pattern>
    <radialGradient id="lamp"><stop offset="0" stop-color="#FFC86E" stop-opacity=".5"/><stop offset="1" stop-color="#FFC86E" stop-opacity="0"/></radialGradient>
