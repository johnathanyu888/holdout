    <rect x="806" y="356" width="64" height="24" rx="11" fill="#8E3226" stroke-width="3.5" transform="rotate(-24 838 368)"/>
    <rect x="880" y="380" width="74" height="46" rx="6" fill="#4A5260" stroke-width="4" transform="rotate(12 917 403)"/>
    <rect x="880" y="380" width="74" height="15" rx="5" fill="#5E6670" stroke-width="3" transform="rotate(12 917 403)"/>
    <rect x="908" y="398" width="15" height="13" rx="2" fill="#D9A441" stroke-width="2.5" transform="rotate(12 917 403)"/>
