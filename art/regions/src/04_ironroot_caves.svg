  <!-- stalagmites, glowing fungus, loose rock, lanterns, darkness at the edges -->
  <use href="#stal" x="470" y="250"/><use href="#stal" x="500" y="282"/><use href="#stal" x="250" y="410"/><use href="#stal" x="680" y="520"/><use href="#stal" x="440" y="170"/><use href="#stal" x="620" y="210"/>
