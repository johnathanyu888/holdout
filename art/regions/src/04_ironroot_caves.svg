    <polygon points="756,628 750,576 766,530 780,578" fill="#C9A6F0"/><polygon points="756,628 766,530 780,578" fill="#A87EDC"/>
    <polygon points="782,622 780,590 792,566 800,592" fill="#7FE6F0"/><polygon points="782,622 792,566 800,592" fill="#4FC6D8"/>
    <polygon points="710,628 708,608 718,594 724,610" fill="#C9A6F0"/>
  </g>
  <flash ref="o_crystal" begin="0.5"/>

  <!-- ===== tappable: ROPE LIFT down a shaft ===== -->
