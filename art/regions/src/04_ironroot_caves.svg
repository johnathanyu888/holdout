  </g>
  <g transform="translate(226 470) rotate(-40)" stroke="#25282C" stroke-linejoin="round"><rect x="-3" y="-34" width="6" height="56" rx="3" fill="#8A5A34" stroke-width="2.5"/><path d="M-24 -34 Q0 -48 24 -34 L22 -28 Q0 -38 -22 -28 Z" fill="#C9CED6" stroke-width="2.5"/></g>
  <flash ref="o_vein" begin="0.7"/>

  <!-- ===== tappable: ORE CART on the rails ===== -->
  <g transform="translate(566 440) rotate(-26)"><rect x="-46" y="-30" width="92" height="60" rx="6" fill="#000" opacity=".3" filter="url(#sh)" transform="translate(5 8)"/></g>
