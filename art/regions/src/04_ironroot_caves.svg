    <polygon points="282,236 330,210 372,222 380,254 330,262" fill="#9A7262"/>
    <g fill="#B8703E" stroke-width="2"><polygon points="300,244 312,236 318,250 306,254"/><polygon points="346,226 360,222 362,236 350,238"/><polygon points="336,270 350,264 354,280 340,282"/></g>
    <g fill="#8E98A2" stroke-width="2"><polygon points="322,238 332,232 336,244"/><polygon points="364,250 374,246 376,258"/></g>
