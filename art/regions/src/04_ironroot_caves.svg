  <use href="#rock" transform="translate(480 360) scale(.6)"/><use href="#rock" transform="translate(660 150) scale(.5)"/><use href="#rock" transform="translate(280 520) scale(.55)"/>
  <use href="#hang" x="420" y="330"/><use href="#hang" x="160" y="230"/>
  <rect width="1000" height="700" fill="url(#dark)"/>

  <card x="420" y="140" ax="340" ay="214" name="Root-wrapped ore" desc="Iron ore cracked open by old roots." time="2h" loot="stone,scrap" danger="risky"/>
