    <circle cx="380" cy="566" r="12" fill="#8E98A2" stroke-width="3"/><circle cx="380" cy="566" r="4" fill="#5E6670" stroke-width="1.5"/>
    <rect x="364" y="602" width="32" height="22" rx="3" fill="url(#plank)" stroke-width="3"/>
  </g>
  <path d="M380 578 V602" stroke="#D8C08C" stroke-width="3"/>
