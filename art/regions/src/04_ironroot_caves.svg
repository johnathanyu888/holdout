    <rect x="-38" y="-22" width="76" height="44" rx="4" fill="#3A3E44" stroke-width="2.5"/>
    <g stroke-width="2.5"><polygon points="-30,-6 -18,-16 -6,-10 -10,4 -26,6" fill="#9A7262"/><polygon points="-4,-12 12,-18 22,-6 12,6 -2,2" fill="#B8703E"/><polygon points="14,0 30,-8 34,8 20,14" fill="#9A7262"/><polygon points="-24,6 -8,4 -4,16 -20,18" fill="#8E98A2"/></g>
    <g fill="#2A2A2E" stroke-width="2"><rect x="-40" y="-36" width="16" height="8" rx="3"/><rect x="24" y="-36" width="16" height="8" rx="3"/><rect x="-40" y="28" width="16" height="8" rx="3"/><rect x="24" y="28" width="16" height="8" rx="3"/></g>
  </g>
