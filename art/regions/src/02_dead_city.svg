  <rect width="1000" height="700" fill="#3A3632" opacity=".12"/>

  <card x="700" y="96" ax="460" ay="160" name="Gutted apartments" desc="The roof burned through. Rooms lie open." time="2h" loot="cloth,wire" danger="danger"/>
  <hud region="DEAD CITY" danger="danger" hours="7" loot="Cloth, glass, wire"/>
</svg>
