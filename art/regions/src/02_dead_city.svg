    <polygon points="350,176 350,320 236,320 240,214 300,210" fill="#4A4642" stroke-width="3"/>
    <polygon points="350,214 350,320 268,320 270,248 312,244" fill="url(#slab)" stroke-width="2.5"/>
    <polygon points="350,260 350,320 300,320 302,280" fill="#2A2826" stroke-width="2.5"/>
    <path d="M250 230 L340 230 M256 258 L340 258 M262 286 L340 286 M276 220 V320 M310 216 V320" stroke="#7A8088" stroke-width="4"/>
    <path d="M300 210 l-10 -16 M240 214 l-16 -8 M270 248 l-14 -10" stroke="#8A6A5A" stroke-width="2.5"/>
    <use href="#ac" x="60" y="60"/><use href="#ac" x="100" y="60"/><use href="#ac" x="60" y="100"/>
    <circle cx="200" cy="80" r="26" fill="#C9CED6" stroke-width="3"/><circle cx="200" cy="80" r="16" fill="none" stroke="#8E98A2" stroke-width="3"/>
    <rect x="130" y="200" width="40" height="30" rx="3" fill="#5E6670" stroke-width="2.5"/>
