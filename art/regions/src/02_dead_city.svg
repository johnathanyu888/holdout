  <!-- cones, a barricade, paper, ash -->
  <g stroke="#25282C" stroke-width="2.5"><circle cx="540" cy="370" r="9" fill="#F28C38"/><circle cx="690" cy="300" r="9" fill="#F28C38"/><rect x="40" y="366" width="80" height="14" rx="3" fill="#F2F2EE"/></g>
