  <path d="M0 406 H550 M674 406 H1000 M612 0 V336 M612 476 V700" stroke="#E0C040" stroke-width="4" stroke-dasharray="24 20" opacity=".7"/>
  <g fill="#E8E8E2" opacity=".85"><rect x="574" y="360" width="76" height="9"/><rect x="574" y="380" width="76" height="9"/><rect x="574" y="400" width="76" height="9"/><rect x="574" y="420" width="76" height="9"/><rect x="574" y="440" width="76" height="9"/></g>
