    <g fill="#2A2A2E" stroke-width="2.5"><circle cx="-80" cy="16" r="13"/><circle cx="80" cy="16" r="13"/></g>
    <rect x="-40" y="6" width="60" height="12" rx="3" fill="#fff" stroke-width="2"/>
