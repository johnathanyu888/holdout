  </g>
  <use href="#rubR" x="320" y="470"/><use href="#rubR" x="520" y="476"/><use href="#rubR" transform="translate(550 520) scale(.8)"/><use href="#brick" transform="translate(420 468) rotate(20)"/><use href="#brick" transform="translate(556 560) rotate(-30)"/>
  <use href="#plume" x="430" y="580"/>
