<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
<!--KIT2-->
    <pattern id="asph" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#4E5156"/><circle cx="12" cy="18" r="1.6" fill="#5E6166"/><circle cx="44" cy="40" r="1.6" fill="#42454A"/><path d="M30 50 l6 -4" stroke="#44474C" stroke-width="1.5"/></pattern>
    <pattern id="walk" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#A8A69E"/><path d="M30 0 V30 H0" fill="none" stroke="#908E86" stroke-width="2"/></pattern>
    <pattern id="gravel" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#8A8882"/><circle cx="6" cy="8" r="1.8" fill="#76746E"/><circle cx="20" cy="18" r="2" fill="#9C9A94"/><circle cx="12" cy="26" r="1.5" fill="#76746E"/></pattern>
    <pattern id="tar" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#5E5A56"/><path d="M0 20 H40" stroke="#54504C" stroke-width="2"/><circle cx="30" cy="10" r="2" fill="#6A6662"/></pattern>
    <pattern id="brickR" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#A8553E"/><path d="M0 6 H24 M12 0 V6 M0 6 V12" stroke="#8E4432" stroke-width="1.5"/></pattern>
    <pattern id="slab" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#6E6A64"/><path d="M40 0 V40 H0" fill="none" stroke="#5E5A54" stroke-width="2"/></pattern>
    <pattern id="tiles" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#D8CDB4"/><rect width="8" height="8" fill="#C4B898"/><rect x="8" y="8" width="8" height="8" fill="#C4B898"/></pattern>
    <pattern id="wood" width="12" height="40" patternUnits="userSpaceOnUse"><rect width="12" height="40" fill="#A8794A"/><path d="M12 0 V40" stroke="#7A5232" stroke-width="2"/></pattern>
    <pattern id="carpet" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#6E7FA3"/><circle cx="5" cy="5" r="1.2" fill="#5E6F93"/></pattern>
    <pattern id="park" width="60" height="120" patternUnits="userSpaceOnUse"><rect width="60" height="120" fill="#6A6C70"/><path d="M58 0 V50 M58 70 V120" stroke="#E8E4DA" stroke-width="3"/></pattern>
    <radialGradient id="vig"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
    <g id="rubR"><path d="M-14 6 Q-16 -6 -5 -10 Q7 -14 14 -5 Q17 6 8 10 Q-5 14 -14 6 Z" fill="#8E8A82" stroke="#25282C" stroke-width="2.5"/><path d="M-6 -4 L2 -7" stroke="#B4AFA6" stroke-width="2.5" stroke-linecap="round"/></g>
    <g id="brick"><rect x="-8" y="-4" width="16" height="8" rx="1.5" fill="#A8553E" stroke="#25282C" stroke-width="2"/></g>
    <g id="shard"><polygon points="-5,3 -2,-6 4,-3 3,5" fill="#9EE6F0" stroke="#25282C" stroke-width="1.6"/></g>
    <g id="plume" opacity=".55"><circle r="22" fill="#4A4644"/><circle cx="26" cy="-14" r="26" fill="#5A5654"/><circle cx="56" cy="-36" r="30" fill="#6A6664"/><circle cx="92" cy="-60" r="26" fill="#7A7674"/></g>
    <g id="flame"><circle cy="-8" r="26" fill="url(#warm)"/><path d="M-12 8 Q-15 -8 -6 -13 Q-6 -3 0 -6 Q-2 -19 5 -27 Q9 -11 11 -8 Q15 -3 12 8 Z" fill="#FF5A24" stroke="#25282C" stroke-width="2.6" stroke-linejoin="round"/><path d="M-5 8 Q-5 0 0 -3 Q2 3 4 0 Q6 4 5 8 Z" fill="#FFD34D"/></g>
    <g id="jam"><rect x="-36" y="-17" width="72" height="34" rx="9" stroke="#25282C" stroke-width="3.5"/><rect x="-12" y="-13" width="28" height="26" rx="5" fill="#3A4A5C" stroke="#25282C" stroke-width="2.5"/><path d="M-6 -8 L2 0 L-4 8" stroke="#9EC6E0" stroke-width="2" fill="none"/></g>
    <g id="ac"><rect x="-13" y="-10" width="26" height="20" rx="2" fill="#C9CED6" stroke="#25282C" stroke-width="2.2"/><circle r="6.5" fill="#8E98A2" stroke="#25282C" stroke-width="1.6"/><path d="M-4 0 H4 M0 -4 V4" stroke="#5E6670" stroke-width="1.2"/></g>
    <g id="vent"><circle r="6" fill="#8E98A2" stroke="#25282C" stroke-width="2"/><circle r="2.5" fill="#3A3E44"/></g>
    <g id="beam"><rect x="-40" y="-3" width="80" height="6" fill="#7A8088" stroke="#25282C" stroke-width="1.8"/></g>
