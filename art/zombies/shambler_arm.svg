<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 24" width="48" height="24">
  <!-- Shambler arm, top-down, reaching east (+x). The shoulder is the left-middle
       point (0, 12): the game pins it there and stretches/swings it to walk. -->
  <!-- torn sleeve -->
  <rect x="1.5" y="5" width="14" height="14" rx="5" fill="#5E6E92" stroke="#1E2328" stroke-width="2.5"/>
  <!-- forearm -->
  <rect x="11" y="7.5" width="25" height="9" rx="4.5" fill="#8FC46A" stroke="#1E2328" stroke-width="2.5"/>
  <path d="M15 10 H30" stroke="#B7E08F" stroke-width="2" stroke-linecap="round"/>
  <!-- hand with clawing fingers -->
  <circle cx="37" cy="12" r="7" fill="#8FC46A" stroke="#1E2328" stroke-width="2.5"/>
  <path d="M42 7.5 L46 6 M43.5 12 L47 12 M42 16.5 L46 18" stroke="#1E2328" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="35" cy="10" r="1.8" fill="#6E9A4E"/>
</svg>
