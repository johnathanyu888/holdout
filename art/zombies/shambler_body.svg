<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Shambler body (no arms), top-down, faces east (+x). The game adds the two arms
       (shambler_arm.svg) at the shoulders and animates the walk. Flat style, no blur.
       Shoulders/torso in a torn grey-blue shirt, a hunched green head pushed forward. -->
  <!-- torso: rounded shoulders, wider than deep -->
  <path d="M30 26 C40 21 52 22 57 30 C61 38 61 58 57 66 C52 74 40 75 30 70 C24 66 22 58 22 48 C22 38 24 30 30 26 Z" fill="#5E6E92" stroke="#1E2328" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- shirt tones: a darker back panel and a torn hem showing skin -->
  <path d="M30 30 C26 34 25 41 25 48 C25 55 26 62 30 66 C33 60 34 54 34 48 C34 42 33 36 30 30 Z" fill="#4C5A7A"/>
  <path d="M47 24 L50 29 L46 31 L49 35 L53 33" fill="none" stroke="#1E2328" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M41 71 L44 66 L47 70 L50 65 L53 68 C51 71 46 73 41 71 Z" fill="#8FC46A" stroke="#1E2328" stroke-width="2" stroke-linejoin="round"/>
  <path d="M33 40 H40 M31 55 H37" stroke="#7B8BB0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- head, pushed forward and slightly off-centre -->
  <circle cx="57" cy="49" r="15" fill="#8FC46A" stroke="#1E2328" stroke-width="3.5"/>
  <path d="M46 42 A13 13 0 0 1 56 36" fill="none" stroke="#B7E08F" stroke-width="3" stroke-linecap="round"/>
  <!-- rot patches and a few hairs -->
  <circle cx="51" cy="56" r="3.2" fill="#6E9A4E"/><circle cx="55" cy="40" r="2.2" fill="#6E9A4E"/>
  <path d="M47 46 l-4 -2 M47 51 l-4 1" stroke="#1E2328" stroke-width="1.8" stroke-linecap="round"/>
  <!-- eyes looking ahead -->
  <circle cx="65" cy="44" r="3.4" fill="#1E2328"/><circle cx="65" cy="54" r="3.4" fill="#1E2328"/>
  <circle cx="66" cy="43" r="1.1" fill="#FFFFFF"/><circle cx="66" cy="53" r="1.1" fill="#FFFFFF"/>
  <!-- slack jaw -->
  <path d="M70 46 Q72 49 70 52" fill="none" stroke="#1E2328" stroke-width="2.2" stroke-linecap="round"/>
</svg>
