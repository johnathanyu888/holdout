<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420" font-family="system-ui, 'Segoe UI', sans-serif" font-weight="700">
  <!-- HUD pieces from the mockup. Split into separate sprites or rebuild in HTML/CSS. -->

  <!-- Top bar (Day) -->
  <g id="top-bar-day">
    <rect x="10" y="12" width="340" height="64" rx="12" fill="#1C242E" fill-opacity="0.88" stroke="#25282C" stroke-width="2.5"/>
    <text x="24" y="38" font-size="16" fill="#fff">Day 7</text>
    <text x="24" y="60" font-size="11" font-weight="500" fill="#A9BCCF">Runners tonight</text>
    <g id="hours-pips" stroke="#25282C" stroke-width="2">
      <rect x="126" y="24" width="11" height="15" rx="3" fill="#FFD34D"/><rect x="140" y="24" width="11" height="15" rx="3" fill="#FFD34D"/>
      <rect x="154" y="24" width="11" height="15" rx="3" fill="#FFD34D"/><rect x="168" y="24" width="11" height="15" rx="3" fill="#FFD34D"/>
      <rect x="182" y="24" width="11" height="15" rx="3" fill="#FFD34D"/><rect x="196" y="24" width="11" height="15" rx="3" fill="#FFD34D"/>
      <rect x="210" y="24" width="11" height="15" rx="3" fill="#FFD34D"/><rect x="224" y="24" width="11" height="15" rx="3" fill="#3E4C5C"/>
      <rect x="238" y="24" width="11" height="15" rx="3" fill="#3E4C5C"/><rect x="252" y="24" width="11" height="15" rx="3" fill="#3E4C5C"/>
      <rect x="266" y="24" width="11" height="15" rx="3" fill="#3E4C5C"/><rect x="280" y="24" width="11" height="15" rx="3" fill="#3E4C5C"/>
    </g>
    <text x="126" y="62" font-size="11" fill="#FFD34D">7h left</text>
    <g id="flare-button">
      <rect x="250" y="46" width="92" height="22" rx="11" fill="#FF7A3D" stroke="#25282C" stroke-width="2"/>
      <text x="296" y="61" font-size="11" fill="#fff" text-anchor="middle">Flare ready</text>
    </g>
  </g>

  <!-- Top bar (Night) with Main Hall health -->
  <g id="top-bar-night">
    <rect x="10" y="92" width="340" height="58" rx="12" fill="#1C242E" fill-opacity="0.88" stroke="#25282C" stroke-width="2.5"/>
    <text x="24" y="117" font-size="16" fill="#fff">Night 7</text>
    <text x="24" y="138" font-size="11" font-weight="500" fill="#A9BCCF">Runners</text>
    <text x="120" y="114" font-size="11" font-weight="600" fill="#A9BCCF">Main Hall</text>
    <rect x="120" y="122" width="172" height="13" rx="6" fill="#3E4C5C" stroke="#25282C" stroke-width="2"/>
    <rect x="120" y="122" width="117" height="13" rx="6" fill="#FF7A3D" stroke="#25282C" stroke-width="2"/>
    <text x="338" y="134" font-size="14" fill="#fff" text-anchor="end">68%</text>
  </g>

  <!-- Site card -->
  <g id="site-card">
    <rect x="16" y="166" width="128" height="96" rx="12" fill="#1C242E" fill-opacity="0.88" stroke="#25282C" stroke-width="2.5"/>
    <text x="28" y="190" font-size="15" fill="#fff">Junkyard</text>
    <text x="28" y="210" font-size="12" fill="#FFD34D">Search 2h</text>
    <text x="28" y="226" font-size="11" font-weight="500" fill="#A9BCCF">Risk: medium</text>
    <g stroke="#25282C" stroke-width="2.5">
      <rect x="28" y="236" width="16" height="16" rx="3" fill="#AAB2BA"/>
      <rect x="52" y="236" width="16" height="16" rx="3" fill="#D9DDE2"/>
      <rect x="76" y="236" width="16" height="16" rx="3" fill="#3A3A3A"/>
    </g>
  </g>

  <!-- Inventory bar (8 slots) -->
  <g id="inventory-bar">
    <rect x="10" y="280" width="340" height="50" rx="12" fill="#1C242E" fill-opacity="0.88" stroke="#25282C" stroke-width="2.5"/>
    <g fill="#3E4C5C" stroke="#25282C" stroke-width="2">
      <rect x="20" y="290" width="30" height="30" rx="6"/><rect x="56" y="290" width="30" height="30" rx="6"/>
      <rect x="92" y="290" width="30" height="30" rx="6"/><rect x="128" y="290" width="30" height="30" rx="6"/>
      <rect x="164" y="290" width="30" height="30" rx="6"/><rect x="200" y="290" width="30" height="30" rx="6"/>
      <rect x="236" y="290" width="30" height="30" rx="6"/><rect x="272" y="290" width="30" height="30" rx="6"/>
    </g>
    <text x="338" y="311" font-size="11" fill="#A9BCCF" text-anchor="end">4/8</text>
  </g>

  <!-- Raid speed buttons -->
  <g id="speed-buttons">
    <rect x="10" y="350" width="340" height="52" rx="12" fill="#1C242E" fill-opacity="0.88" stroke="#25282C" stroke-width="2.5"/>
    <g stroke="#25282C" stroke-width="2">
      <rect x="22" y="362" width="72" height="28" rx="14" fill="#3E4C5C"/>
      <rect x="104" y="362" width="72" height="28" rx="14" fill="#FFD34D"/>
      <rect x="186" y="362" width="72" height="28" rx="14" fill="#3E4C5C"/>
      <rect x="268" y="362" width="72" height="28" rx="14" fill="#3E4C5C"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="58" y="381" fill="#fff">1x</text><text x="140" y="381" fill="#25282C">2x</text>
      <text x="222" y="381" fill="#fff">4x</text><text x="304" y="381" fill="#fff">Skip</text>
    </g>
  </g>
</svg>
