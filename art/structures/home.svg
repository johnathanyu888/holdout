<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- The survivor's hideout: a small riveted steel shelter, top-down, 1 tile (same 96px canvas as the other 1x1 structures).
       Warm light from the window and the door, smoke from the stovepipe, a radio antenna = someone's inside. -->
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1"/></filter>
    <radialGradient id="glow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#FFC86E" stop-opacity=".8"/><stop offset="1" stop-color="#FFC86E" stop-opacity="0"/></radialGradient>
    <pattern id="ribs" width="8" height="40" patternUnits="userSpaceOnUse"><rect width="8" height="40" fill="#9AA3AD"/><rect width="3.5" height="40" fill="#86909A"/></pattern>
  </defs>
  <!-- warm light out of the door -->
  <path d="M40 84 L56 84 L72 96 L24 96 Z" fill="url(#glow)"/>
  <!-- shadow -->
  <rect x="15" y="17" width="72" height="68" rx="7" fill="#1E2A3A" opacity=".32" filter="url(#sh)"/>
  <!-- steel walls -->
  <rect x="10" y="10" width="76" height="74" rx="8" fill="#5E6670" stroke="#25282C" stroke-width="3.5"/>
  <!-- corrugated steel roof, two halves -->
  <rect x="14" y="14" width="68" height="32" rx="3" fill="url(#ribs)" stroke="#25282C" stroke-width="2.5"/>
  <rect x="14" y="48" width="68" height="32" rx="3" fill="url(#ribs)" stroke="#25282C" stroke-width="2.5"/>
  <rect x="14" y="48" width="68" height="32" rx="3" fill="#000" opacity=".15"/>
  <rect x="10" y="44" width="76" height="7" rx="3" fill="#4A5260" stroke="#25282C" stroke-width="2"/>
  <path d="M16 18 H44" stroke="#C9D0D8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- rivets round the rim -->
  <g fill="#C9CED6" stroke="#25282C" stroke-width="1.2"><circle cx="15" cy="15" r="2"/><circle cx="81" cy="15" r="2"/><circle cx="15" cy="79" r="2"/><circle cx="81" cy="79" r="2"/><circle cx="48" cy="12.5" r="1.6"/><circle cx="12.5" cy="47" r="1.6"/><circle cx="83.5" cy="47" r="1.6"/></g>
  <!-- a welded patch plate with a little rust -->
  <rect x="54" y="56" width="22" height="16" rx="2" fill="#7E8892" stroke="#25282C" stroke-width="2" transform="rotate(-6 65 64)"/>
  <ellipse cx="64" cy="66" rx="5" ry="3" fill="#AA5A28" opacity=".6"/>
  <!-- lit window -->
  <rect x="22" y="54" width="16" height="11" rx="2" fill="#FFE07A" stroke="#25282C" stroke-width="2"/>
  <path d="M30 54 V65" stroke="#25282C" stroke-width="1.6"/>
  <!-- stovepipe + smoke -->
  <g filter="url(#soft)" opacity=".7"><circle cx="64" cy="22" r="6" fill="#C9D3DA"/><circle cx="72" cy="13" r="7" fill="#D6DEE4"/><circle cx="82" cy="6" r="5" fill="#E2E8EC"/></g>
  <circle cx="60" cy="30" r="6.5" fill="#4A5260" stroke="#25282C" stroke-width="2.5"/>
  <circle cx="60" cy="30" r="3" fill="#2A2E35"/>
  <!-- radio antenna -->
  <path d="M28 32 V18 M23 22 H33" stroke="#25282C" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="16" r="3.5" fill="#FF5A4A" stroke="#25282C" stroke-width="1.6"/>
  <!-- steel door, ajar -->
  <rect x="38" y="80" width="20" height="7" rx="2" fill="#2A2E35" stroke="#25282C" stroke-width="2"/>
  <circle cx="64" cy="85" r="3.5" fill="#FFD34D" stroke="#25282C" stroke-width="1.6"/>
  <circle cx="64" cy="85" r="8" fill="#FFD34D" opacity=".3"/>
</svg>
