<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96" width="160" height="96">
  <!-- Live cable, top-down, 2x1 tiles. A snapped power line that shocks anything touching its end; wire into it for power. -->
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <radialGradient id="zap"><stop offset="0" stop-color="#7FE6F0" stop-opacity=".9"/><stop offset="1" stop-color="#7FE6F0" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="128" cy="50" r="30" fill="url(#zap)" opacity=".7"/>
  <!-- junction box -->
  <rect x="12" y="32" width="32" height="38" rx="5" fill="#000" opacity=".3" filter="url(#sh)"/>
  <rect x="8" y="28" width="32" height="38" rx="5" fill="#4A5260" stroke="#25282C" stroke-width="3.5"/>
  <rect x="14" y="34" width="20" height="10" rx="2" fill="#FFD34D" stroke="#25282C" stroke-width="2"/>
  <path d="M22 35 L19 40 H24 L21 44" stroke="#25282C" stroke-width="1.6" fill="none"/>
  <!-- the snapped cable -->
  <path d="M40 54 Q70 30 92 56 Q108 74 124 50" fill="none" stroke="#25282C" stroke-width="14" stroke-linecap="round"/>
  <path d="M40 54 Q70 30 92 56 Q108 74 124 50" fill="none" stroke="#2E3540" stroke-width="8" stroke-linecap="round"/>
  <path d="M46 49 Q70 34 88 52" fill="none" stroke="#5E6670" stroke-width="2.5" stroke-linecap="round"/>
  <!-- frayed copper end + sparks -->
  <g stroke="#E08A3A" stroke-width="3" stroke-linecap="round"><path d="M124 50 l10 -8 M124 50 l12 2 M124 50 l8 10"/></g>
  <g fill="#FFF4C2" stroke="#25282C" stroke-width="1.6" stroke-linejoin="round"><path d="M138 30 L132 44 L138 44 L134 54 L146 38 L140 38 L144 30 Z"/></g>
  <g fill="#7FE6F0"><circle cx="146" cy="58" r="2.5"/><circle cx="118" cy="34" r="2"/><circle cx="150" cy="46" r="1.6"/></g>
</svg>
