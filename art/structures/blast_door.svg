<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96" width="160" height="96">
  <!-- Blast door, top-down, 2x1 tiles (shown shut). Wire it to open or close; when open, the two halves slide into the frame. -->
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <pattern id="haz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFD34D"/><rect width="6" height="12" fill="#25282C"/></pattern>
  </defs>
  <rect x="12" y="34" width="144" height="40" rx="6" fill="#000" opacity=".3" filter="url(#sh)"/>
  <!-- frame posts -->
  <rect x="4" y="26" width="18" height="44" rx="4" fill="#4A5260" stroke="#25282C" stroke-width="3.5"/>
  <rect x="138" y="26" width="18" height="44" rx="4" fill="#4A5260" stroke="#25282C" stroke-width="3.5"/>
  <!-- two door halves -->
  <rect x="22" y="32" width="58" height="32" rx="3" fill="#8E98A2" stroke="#25282C" stroke-width="3.5"/>
  <rect x="80" y="32" width="58" height="32" rx="3" fill="#8E98A2" stroke="#25282C" stroke-width="3.5"/>
  <rect x="22" y="40" width="58" height="16" fill="url(#haz)" stroke="#25282C" stroke-width="2"/>
  <rect x="80" y="40" width="58" height="16" fill="url(#haz)" stroke="#25282C" stroke-width="2"/>
  <path d="M80 30 V66" stroke="#25282C" stroke-width="4"/>
  <g fill="#5E6670" stroke="#25282C" stroke-width="1.6"><circle cx="28" cy="36" r="2"/><circle cx="74" cy="36" r="2"/><circle cx="86" cy="60" r="2"/><circle cx="132" cy="60" r="2"/></g>
  <!-- status lights on the posts -->
  <circle cx="13" cy="34" r="5" fill="#D9534F" stroke="#25282C" stroke-width="2"/>
  <circle cx="13" cy="62" r="5" fill="#2E6A3A" stroke="#25282C" stroke-width="2"/>
  <circle cx="147" cy="34" r="5" fill="#D9534F" stroke="#25282C" stroke-width="2"/>
  <circle cx="147" cy="62" r="5" fill="#2E6A3A" stroke="#25282C" stroke-width="2"/>
  <circle cx="13" cy="34" r="9" fill="#FF5A4A" opacity=".25"/><circle cx="147" cy="34" r="9" fill="#FF5A4A" opacity=".25"/>
</svg>
