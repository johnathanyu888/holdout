<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Power inlet, top-down, 1 tile. Power comes up from underground here; always on. -->
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <radialGradient id="zap"><stop offset="0" stop-color="#7FE6F0" stop-opacity=".9"/><stop offset="1" stop-color="#7FE6F0" stop-opacity="0"/></radialGradient>
    <pattern id="haz" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#FFD34D"/><rect width="7" height="14" fill="#25282C"/></pattern>
  </defs>
  <circle cx="48" cy="48" r="46" fill="url(#zap)" opacity=".55"/>
  <rect x="14" y="16" width="70" height="70" rx="8" fill="#000" opacity=".3" filter="url(#sh)"/>
  <rect x="10" y="10" width="76" height="76" rx="9" fill="url(#haz)" stroke="#25282C" stroke-width="3.5"/>
  <rect x="20" y="20" width="56" height="56" rx="6" fill="#4A5260" stroke="#25282C" stroke-width="3"/>
  <g fill="#8E98A2" stroke="#25282C" stroke-width="1.6"><circle cx="25" cy="25" r="2.5"/><circle cx="71" cy="25" r="2.5"/><circle cx="25" cy="71" r="2.5"/><circle cx="71" cy="71" r="2.5"/></g>
  <!-- glowing core with a bolt -->
  <circle cx="48" cy="48" r="17" fill="#2E3540" stroke="#25282C" stroke-width="3"/>
  <circle cx="48" cy="48" r="12" fill="#7FE6F0"/>
  <path d="M51 38 L42 50 H48 L44 60 L55 46 H49 Z" fill="#FFF4C2" stroke="#25282C" stroke-width="2" stroke-linejoin="round"/>
  <path d="M36 36 A17 17 0 0 1 48 31" stroke="#B8F4FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
