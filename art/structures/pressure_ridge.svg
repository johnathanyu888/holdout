<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" width="128" height="64">
  <!-- Pressure ridge, top-down, 2x1 tiles: a tilted slab of ice shoved up into a ramp.
       A zombie that hits it at speed is launched ~3 tiles in the arrow's direction, flying over whatever's below. -->
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter></defs>
  <polygon points="10,52 30,14 98,10 122,50 96,58 34,58" fill="#1E3A5A" opacity=".3" filter="url(#sh)" transform="translate(3 4)"/>
  <!-- low side (ramp) -->
  <polygon points="8,50 28,14 64,12 64,56 32,56" fill="#BFE6F2" stroke="#25282C" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- high side: raised, cracked lip -->
  <polygon points="64,12 98,8 122,48 96,58 64,56" fill="#E8F8FF" stroke="#25282C" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="96,10 122,48 112,52 90,14" fill="#8CCDE6"/>
  <path d="M74 20 L84 34 L78 48 M100 18 L104 30" stroke="#6FB6D6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M30 22 L56 20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- launch arrow -->
  <path d="M22 34 H74 M64 26 L76 34 L64 42" fill="none" stroke="#25282C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 34 H74 M64 26 L76 34 L64 42" fill="none" stroke="#FFD34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
