<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96" width="160" height="96">
  <!-- Broken crusher, top-down, 2x1 tiles. Wire it up and it slams down on whatever stands in it. -->
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <pattern id="haz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFD34D"/><rect width="6" height="12" fill="#25282C"/></pattern>
  </defs>
  <rect x="14" y="18" width="136" height="68" rx="8" fill="#000" opacity=".3" filter="url(#sh)"/>
  <!-- frame -->
  <rect x="8" y="12" width="144" height="72" rx="8" fill="#5E6670" stroke="#25282C" stroke-width="4"/>
  <rect x="8" y="12" width="144" height="12" rx="6" fill="url(#haz)" stroke="#25282C" stroke-width="2.5"/>
  <rect x="8" y="72" width="144" height="12" rx="6" fill="url(#haz)" stroke="#25282C" stroke-width="2.5"/>
  <!-- the press plate -->
  <rect x="26" y="30" width="108" height="36" rx="4" fill="#9AA3AD" stroke="#25282C" stroke-width="3"/>
  <path d="M34 38 H126 M34 48 H126 M34 58 H126" stroke="#7E8892" stroke-width="3"/>
  <!-- pistons -->
  <g fill="#C9CED6" stroke="#25282C" stroke-width="2.5"><circle cx="18" cy="48" r="7"/><circle cx="142" cy="48" r="7"/></g>
  <!-- broken corner: cracked plate, hanging bolt, sparks -->
  <polygon points="134,30 134,52 116,30" fill="#2A2E35" stroke="#25282C" stroke-width="2.5"/>
  <path d="M116 30 L124 40 L120 46" stroke="#25282C" stroke-width="2" fill="none"/>
  <g fill="#AA5A28" opacity=".7"><ellipse cx="50" cy="58" rx="10" ry="5"/></g>
  <g fill="#FFD34D" stroke="#25282C" stroke-width="1.2"><path d="M128 54 l4 -6 l1 5 l5 -2 l-4 7 Z"/></g>
  <g fill="#FFE07A"><circle cx="140" cy="30" r="2"/><circle cx="124" cy="62" r="1.6"/></g>
</svg>
