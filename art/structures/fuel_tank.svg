<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Fuel tank, top-down, 1 tile. One big ignition when powered. -->
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter></defs>
  <circle cx="51" cy="53" r="38" fill="#000" opacity=".3" filter="url(#sh)"/>
  <circle cx="48" cy="48" r="38" fill="#B8473A" stroke="#25282C" stroke-width="4"/>
  <circle cx="48" cy="48" r="30" fill="#D0624F" stroke="#25282C" stroke-width="2.5"/>
  <circle cx="48" cy="48" r="30" fill="none" stroke="#A83C2E" stroke-width="2" stroke-dasharray="3 6"/>
  <!-- hatch -->
  <circle cx="48" cy="48" r="12" fill="#8E98A2" stroke="#25282C" stroke-width="3"/>
  <path d="M40 48 H56 M48 40 V56" stroke="#5E6670" stroke-width="2.5"/>
  <!-- flammable diamond -->
  <g transform="translate(70 24) rotate(45)"><rect x="-9" y="-9" width="18" height="18" rx="2" fill="#FFD34D" stroke="#25282C" stroke-width="2.5"/></g>
  <path d="M68 28 Q66 22 70 18 Q71 22 73 21 Q73 26 70 28 Z" fill="#E0584A" stroke="#25282C" stroke-width="1.4"/>
  <!-- valve -->
  <rect x="10" y="44" width="10" height="8" rx="2" fill="#8E98A2" stroke="#25282C" stroke-width="2.2"/>
  <circle cx="10" cy="48" r="6" fill="#E0584A" stroke="#25282C" stroke-width="2.2"/>
  <path d="M30 26 A26 26 0 0 1 48 20" stroke="#F08070" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
