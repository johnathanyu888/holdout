<!doctype html>
<html><head><meta charset="utf-8"><title>Holdout icons</title>
<style>
  body{margin:0;padding:24px;background:#2A3442;font-family:system-ui,'Segoe UI',sans-serif;color:#F3E6C0}
  h2{margin:4px 0 12px;letter-spacing:2px;font-size:18px;color:#FFD34D}
  .g{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
  .c{background:#7CC24B;border:3px solid #25282C;border-radius:12px;padding:8px 4px 6px;text-align:center}
  .c img{width:128px;height:128px;display:block;margin:0 auto}
  .c b{display:block;font-size:13px;color:#1E2328;margin-top:2px}
</style></head><body>
<h2>RAW MATERIALS</h2>
<div class="g">
<div class="c"><img src="materials/wood.svg"><b>Wood</b></div><div class="c"><img src="materials/stone.svg"><b>Stone</b></div><div class="c"><img src="materials/scrap.svg"><b>Scrap metal</b></div><div class="c"><img src="materials/rope.svg"><b>Rope</b></div><div class="c"><img src="materials/wire.svg"><b>Wire</b></div><div class="c"><img src="materials/gears.svg"><b>Gears</b></div><div class="c"><img src="materials/cloth.svg"><b>Cloth</b></div><div class="c"><img src="materials/glass.svg"><b>Glass</b></div>
</div>
<h2>CRAFTABLE ITEMS</h2>
<div class="g">
<div class="c"><img src="craftables/wood_wall.svg"><b>Wood wall</b></div><div class="c"><img src="craftables/stone_wall.svg"><b>Stone wall</b></div><div class="c"><img src="craftables/metal_wall.svg"><b>Metal wall</b></div><div class="c"><img src="craftables/wood_spikes.svg"><b>Wood spikes</b></div><div class="c"><img src="craftables/bear_trap.svg"><b>Bear trap</b></div><div class="c"><img src="craftables/tripwire.svg"><b>Tripwire</b></div>
<div class="c"><img src="craftables/pressure_plate.svg"><b>Pressure plate</b></div><div class="c"><img src="craftables/swinging_log.svg"><b>Swinging log</b></div><div class="c"><img src="craftables/falling_rocks.svg"><b>Falling rocks</b></div><div class="c"><img src="craftables/net_drop.svg"><b>Net drop</b></div><div class="c"><img src="craftables/tin_can_rattle.svg"><b>Tin can rattle</b></div><div class="c"><img src="craftables/torch.svg"><b>Torch</b></div>
</div>
</body></html>
