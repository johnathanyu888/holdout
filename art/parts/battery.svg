<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Battery, from above: a chunky power cell with a red + and a grey - terminal,
       a gold label with a lightning bolt, and a row of green charge cells. -->
  <g transform="translate(3 4)" fill="#000" opacity=".22"><rect x="12" y="20" width="72" height="62" rx="9"/></g>
  <!-- terminals (behind the lid's edge) -->
  <rect x="20" y="13" width="16" height="12" rx="3" fill="#E8574A" stroke="#25282C" stroke-width="2.5"/>
  <rect x="60" y="13" width="16" height="12" rx="3" fill="#8E98A2" stroke="#25282C" stroke-width="2.5"/>
  <!-- body -->
  <rect x="12" y="20" width="72" height="62" rx="9" fill="#3A4250" stroke="#25282C" stroke-width="3"/>
  <!-- lid band and highlight -->
  <path d="M15 32 H81" stroke="#25282C" stroke-width="2.5"/>
  <path d="M19 26 H45" stroke="#5E6878" stroke-width="3" stroke-linecap="round"/>
  <!-- + and - marks on the lid -->
  <path d="M28 26.5 V31.5 M25.5 29 H30.5" stroke="#FFD4CF" stroke-width="2" stroke-linecap="round"/>
  <path d="M65.5 29 H70.5" stroke="#E8EEF2" stroke-width="2" stroke-linecap="round"/>
  <!-- gold label with a bolt -->
  <rect x="22" y="37" width="52" height="25" rx="5" fill="#F2C14E" stroke="#25282C" stroke-width="2.5"/>
  <path d="M51 40 L41 51 H48 L44.5 59.5 L55.5 47.5 H48.5 Z" fill="#25282C" stroke="#25282C" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- charge cells -->
  <rect x="22" y="66" width="52" height="10" rx="3" fill="#25282C"/>
  <g fill="#7FE6A0"><rect x="25" y="68.5" width="10" height="5" rx="1.5"/><rect x="37.5" y="68.5" width="10" height="5" rx="1.5"/><rect x="50" y="68.5" width="10" height="5" rx="1.5"/><rect x="62.5" y="68.5" width="9" height="5" rx="1.5"/></g>
</svg>
